[build-system]
requires = ["setuptools>=46.1.0", "setuptools_scm[toml]>=5"]
build-backend = "setuptools.build_meta"

[project]
name = "plotomatic"
dynamic = ["version"]
description = "AI-powered story planning assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Matt Williamson", email = "matt@aimatt.com"}
]
dependencies = [
    "streamlit>=1.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "streamlit-extras>=0.3.0",
    "langchain>=0.1.0",
    "openai>=1.0.0",
    "emoji>=2.10.0",
    "gitpython>=3.1.0",
    "ollama>=0.1.0",
    "httpx>=0.26.0",
    "json-repair>=0.5.0",
    "pygments>=2.17.0",
    "unidecode>=1.3.0",
    "jsonschema2md>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.1",
    "black>=23.0",
    "flake8>=6.1",
    "isort>=5.13",
    "pre-commit>=3.5",
    "mypy>=1.7"
]

[tool.setuptools]
packages = ["plotomatic"]
package-dir = {"" = "src"}

[tool.pytest]
testpaths = ["src/plotomatic/tests"]
python_files = ["test_*.py"]
addopts = """
    --cov=plotomatic
    --cov-report=term-missing
    --verbose
"""

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
